# Deterministic evals (scripts/eval_run.py). tier must = known truth, CI fails on regression; tier coverage = known gap, reported only.
# Replace these examples with questions your agents actually ask. Add one whenever a session had to re-learn something.
- id: deploy-path
  q: How do prod changes get deployed?
  run: {search: "deploy gitops"}
  expect: [example-gitops]
  needs: [facts/example-fact.md]
  tier: must
- id: unknown-topic-has-no-hit
  q: A topic nobody wrote down must not produce a confident answer
  run: {cmd: [python3, scripts/brain.py, search, zzzqxvnonsense]}
  expect: [no matches]
  tier: must
- id: workstream-listed
  q: What work is in flight?
  run: {cmd: [python3, scripts/brain.py, ws, list]}
  expect: [example-workstream]
  needs: [workstreams/example-workstream/STATE.md]
  tier: must
- id: session-start-lists-workstreams
  q: What does an agent see at session start in a repo with a matching workstream?
  run: {cmd: [python3, scripts/session_start.py, --no-probes, --cwd, evals]}
  expect: ["Brain context for"]
  tier: must
- id: lint-clean
  q: Is the brain itself lint-clean?
  run: {cmd: [python3, scripts/lint_facts.py, --strict]}
  expect: ["0 hard"]
  tier: must
- id: rare-term-outranks-common
  q: Searching "deploy gitops" must surface the gitops fact first (rare term outranks a common one)
  run: {cmd: [python3, scripts/brain.py, search, deploy, gitops]}
  first_line: example-fact
  needs: [facts/example-fact.md]
  tier: must
- id: init-is-documented
  q: How do I set the brain up in one command?
  run: {search: "init claude"}
  expect: [brain.py init]
  tier: must
- id: capture-is-documented
  q: How are learnings captured automatically?
  run: {search: "capture_hook"}
  expect: [capture_hook]
  tier: must
- id: compaction-is-documented
  q: How do I compact the inbox?
  run: {search: "compact inbox"}
  expect: [brain.py compact]
  tier: must
- id: mining-is-documented
  q: How do I find learnings in past sessions?
  run: {search: "mine_sessions recurring errors"}
  expect: [mine_sessions]
  tier: must

# Brain abstraction contracts and bounded context.
- expect:
  - facts/brain-record-extension.md
  - _records.validate
  id: record-boundary
  needs: [facts/brain-record-extension.md]
  q: How do I add a record writer without inventing another schema?
  run:
    search: record writer extension boundary
  tier: must
- expect:
  - brain.py ws complete
  id: completion-evidence
  q: How do I complete a workstream with recorded evidence?
  run:
    search: ws complete check command result
  tier: must
- expect:
  - 'Context:'
  - 'omitted:'
  id: bounded-context
  q: How do I retrieve bounded context with trust labels?
  run:
    cmd:
    - python3
    - scripts/brain.py
    - context
    - record writer
    - --budget
    - '4000'
  tier: must

# Scoped vocabulary: find definitions, not inferred implementation truth.
- id: language-record-verification
  q: Does a fact verification attestation establish truth?
  run:
    cmd:
    - python3
    - scripts/brain.py
    - context
    - verification attestation fact-record
    - --budget
    - '8000'
  expect:
  - facts/brain-record-language.md
  - 'context: fact-record'
  - does not establish truth
  tier: must
  needs:
  - facts/brain-record-language.md
- id: language-context-verification
  q: Can a fact remain verified while context presents it as stale?
  run:
    cmd:
    - python3
    - scripts/brain.py
    - context
    - context-bundle verified stale
    - --budget
    - '8000'
  expect:
  - facts/brain-context-language.md
  - 'context: context-bundle'
  - '90'
  tier: must
  needs:
  - facts/brain-context-language.md
- id: clash-detected
  q: Two documents tell an agent opposite things about the same tool; does the brain notice?
  run: {cmd: [env, BRAIN_DIR=tests/fixtures/clash, python3, scripts/clash.py]}
  expect: ["CLASH `rsync`", "facts/deploy.md", "skills/deploy/SKILL.md"]
  tier: must
- id: brain-clash-free
  q: Does the brain contradict itself (fact against fact or skill)?
  run: {cmd: [python3, scripts/clash.py, --strict]}
  expect: ["no clashes"]
  tier: must
