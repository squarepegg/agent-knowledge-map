name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { python: ["3.10", "3.11", "3.12", "3.13"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install pyyaml
      - run: python -m compileall -q scripts tests
      - run: CHECK_TEMPLATE=1 python -m unittest discover -s tests -v
      - run: BRAIN_DIR=$PWD python scripts/lint_facts.py --strict
      - name: Deterministic evals (tier must fails the build)
        run: BRAIN_DIR=$PWD python scripts/eval_run.py
      - name: Retrieval recall floor
        run: BRAIN_DIR=$PWD python scripts/recall_eval.py
  mutants-plan:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "files=$(ls tests/mutants/*.yaml | python3 -c 'import sys,json;print(json.dumps(sys.stdin.read().split()))')" >> "$GITHUB_OUTPUT"
  mutation:
    needs: mutants-plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: { file: "${{ fromJson(needs.mutants-plan.outputs.files) }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install pyyaml
      - name: Mutation gate (all hand-written mutants must be killed)
        run: python scripts/mutation_check.py "${{ matrix.file }}"
  fresh-clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: src }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - name: README quick start in a clean clone with an isolated HOME
        run: |
          SRC="$PWD/src"
          export HOME=$(mktemp -d)
          git clone "$SRC" "$HOME/brain"
          export BRAIN_DIR="$HOME/brain"
          python "$BRAIN_DIR/scripts/brain.py" init --org "Smoke Co" --no-examples --claude
          python "$BRAIN_DIR/scripts/brain.py" ws new smoke
          python "$BRAIN_DIR/scripts/brain.py" note gotcha "Smoke test" "it works"
          python "$BRAIN_DIR/scripts/brain.py" compact --write
          python "$BRAIN_DIR/scripts/brain.py" search smoke
          python "$BRAIN_DIR/scripts/lint_facts.py" --strict
          python "$BRAIN_DIR/scripts/eval_run.py"
          python "$BRAIN_DIR/scripts/maintain.py" --only primer lint evals
          for ex in data-team web-app platform-infra solo-dev; do
            rm -rf "$HOME/b2" && git clone "$SRC" "$HOME/b2"
            BRAIN_DIR="$HOME/b2" python "$HOME/b2/scripts/brain.py" init --example $ex
            BRAIN_DIR="$HOME/b2" python "$HOME/b2/scripts/lint_facts.py" --strict
            BRAIN_DIR="$HOME/b2" python "$HOME/b2/scripts/eval_run.py"
            BRAIN_DIR="$HOME/b2" python "$HOME/b2/scripts/recall_eval.py"
          done
