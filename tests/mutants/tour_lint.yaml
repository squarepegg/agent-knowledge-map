- {id: unpinned-off, old: 'if not w.hash: f.append(("UNPINNED"', new: 'if not w.hash: f.append(("XX"'}
- {id: stale-off, old: 'if hash_text(content, w.start, w.end, w.heading) != w.hash:', new: 'if False:'}
- {id: stale-inverted, old: 'if hash_text(content, w.start, w.end, w.heading) != w.hash:', new: 'if hash_text(content, w.start, w.end, w.heading) == w.hash:'}
- {id: copied-threshold, old: 'len(why) >= 40', new: 'len(why) >= 0'}
- {id: copied-off, old: 'and why in tgt', new: 'and False'}
- {id: orphan-no-cycle-guard, old: 'l not in seen_ and l != w.id', new: 'l != w.id'}
- {id: orphan-off, old: 'if w.kind != "Need" and not reaches(w)', new: 'if False'}
- {id: missingkind-off, old: 'if wps and k not in kinds', new: 'if False'}
- {id: draft-off, old: 'if status == "draft"', new: 'if False'}
- {id: hash-no-rstrip, old: 'l.rstrip() for l in lines', new: 'l for l in lines'}
- {id: hash-range-off, old: 'lines = lines[start - 1:(end or start)]', new: 'pass'}
- {id: hash-range-offbyone, old: 'lines[start - 1:(end or start)]', new: 'lines[start:(end or start)]'}
- {id: pin-skip-missing, old: 'if content is None or w.exists: continue', new: 'if w.exists: continue'}
- {id: reader-gitless, old: 'os.path.join(p, ".git")', new: 'os.path.join(p, "")'}
- {id: sort-off, old: 'return sorted(f, key=lambda x: (x[1], x[0], x[2]))', new: 'return f'}
