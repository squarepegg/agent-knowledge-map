- {id: owner-off, old: 'if w.kind == "Question" and not', new: 'if False and not'}
- {id: noneed-off, old: 'and "Need" not in kinds_linked', new: 'and False'}
- {id: noproof-off, old: 'and not kinds_linked & {"Test", "Risk", "Question"}', new: 'and False'}
- {id: proof-no-question, old: '{"Test", "Risk", "Question"}', new: '{"Test", "Risk"}'}
- {id: norepo-off, old: 'except LookupError: f.append(("NOREPO"', new: 'except LookupError: f.append(("XX"'}
- {id: broken-off, old: 'if content is None: f.append(("BROKEN"', new: 'if content is None: f.append(("XX"'}
