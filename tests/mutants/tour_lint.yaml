- {id: heading-missing-off, old: 'if n == 0: f.append(("BROKEN"', new: 'if n == 99: f.append(("BROKEN"'}
- {id: exists-hashes, old: 'if w.exists: continue', new: 'pass'}
- {id: pin-exists, old: 'if content is None or w.exists: continue', new: 'if content is None: continue'}
- {id: pin-heading-missing, old: "if h is None: continue\n        w.hash = h", new: "w.hash = h"}
- {id: render-heading, old: 'rng = f"#h:{w.heading}" if w.heading else', new: 'rng = ""  if w.heading else'}
- {id: render-exists, old: 'else "#exists" if w.exists else', new: 'else "" if w.exists else'}
