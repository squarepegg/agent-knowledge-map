- {id: parse-exists, old: '(m["h"] or "").strip(), bool(m["ex"])', new: '(m["h"] or "").strip(), False'}
- {id: copied-uses-heading, old: "anchored_text(content, w.start, w.end, w.heading)), _norm(w.why)", new: "anchored_text(content, w.start, w.end)), _norm(w.why)"}
- {id: stale-uses-heading, old: "hash_text(content, w.start, w.end, w.heading) != w.hash", new: "hash_text(content, w.start, w.end) != w.hash"}
- {id: pinned-oldest, old: 'if content is not None and hash_text(content, w.start, w.end, w.heading) == w.hash: return sha', new: 'if content is not None and hash_text(content, w.start, w.end, w.heading) == w.hash: pass; continue; return sha'}
- {id: pinned-none-ok, old: 'if content is not None and hash_text', new: 'if hash_text'}
- {id: prompt-no-choices, old: 'Decide: (a) your why still holds -> run --pin; (b)', new: 'Decide: (b)'}
- {id: prompt-no-diff, old: 'diff = "\n".join(difflib.unified_diff(', new: 'diff = "x"; _ = ("\n".join(difflib.unified_diff('}
- {id: prompt-unknown-pin, old: 'if pinned is None: body', new: 'if False: body'}
- {id: review-exists, old: 'if w.exists or not w.hash: continue', new: 'if not w.hash: continue'}
- {id: review-unpinned, old: 'if w.exists or not w.hash: continue', new: 'if w.exists: continue'}
- {id: review-all, old: 'in (None, w.hash): continue', new: 'in (None,): continue'}
- {id: review-empty-msg, old: '"\n".join(out) or "No stale waypoints."', new: '"\n".join(out)'}
- {id: history-limit, old: 'f"-n{limit}"', new: '"-n1"'}
- {id: bt-fire-off, old: 'if prev is not None and h != prev: fires += 1', new: 'if False: fires += 1'}
- {id: bt-first-fires, old: 'if prev is not None and h != prev: fires += 1', new: 'if h != prev: fires += 1'}
- {id: bt-skip-none, old: "if h is None: continue\n        n += 1", new: "n += 1"}
- {id: bt-count, old: "n += 1\n        if prev is not None", new: "if prev is not None"}
