- {id: sec-fence2-off, old: 'if lines[j].lstrip().startswith("```"): f2 = not f2', new: 'pass'}
- {id: sec-level-lt, old: 'len(m2.group(1)) <= lvl', new: 'len(m2.group(1)) < lvl'}
- {id: sec-level-any, old: 'len(m2.group(1)) <= lvl', new: 'True'}
- {id: sec-nocase, old: "_norm(m.group(2)) == want", new: "m.group(2) == heading"}
- {id: anch-multi-ok, old: 'if len(sec) == 1 else None', new: 'if sec else None'}
- {id: hash-none-passthrough, old: 'return None if t is None else hashlib', new: 'return hashlib'}
